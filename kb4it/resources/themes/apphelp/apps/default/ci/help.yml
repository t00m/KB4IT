# Copy this file to .github/workflows/help.yml in the application repository.
# It builds the help in help/ and publishes it to GitHub Pages.
# Settings > Pages > Source must be "GitHub Actions".
name: help

on:
  push:
    branches: [main]
    paths: ["help/**", ".github/workflows/help.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install KB4IT
        run: pip install "KB4IT>=0.7.9"
      - name: Build the help
        run: kb4it build help/config/repo.json --force
      - uses: actions/upload-pages-artifact@v3
        with:
          path: help/target
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
