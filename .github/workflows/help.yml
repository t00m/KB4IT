# Builds the help in help/ with the KB4IT of the same commit and publishes it to GitHub Pages.
#
# Every push that touches the help, the code or the themes builds it, on any
# branch, so a broken page, bad metadata or a change that breaks the apphelp
# theme fails here and not after a merge. Only master deploys.
#
# Settings > Pages > Source must be "GitHub Actions".
name: help

on:
  push:
    paths:
      - 'help/**'
      - 'kb4it/**'
      - 'pyproject.toml'
      - 'action.yml'
      - 'scripts/action/**'
      - '.github/workflows/help.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: help-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The KB4IT action of this commit: installs this KB4IT, checks the pages, builds.
      - id: kb4it
        uses: ./
        with:
          config: help/config/repo.json
          python-version: "3.11"
          force: "true"

      - name: Upload the site
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ steps.kb4it.outputs.target }}

  deploy:
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
