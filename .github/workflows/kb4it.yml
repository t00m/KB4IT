name: check-kb4it

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version-file: .python-version

      - name: Install KB4IT
        run: uv tool install .

      - name: Run kb4it
        run: kb4it --version

      - name: Run tests
        run: ./scripts/devel/test.sh

      - name: Build wheel
        run: uv build --wheel

      - name: Check that every tracked theme is in the wheel
        run: python3 scripts/devel/check_wheel_themes.py
